<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060a"/>
      <stop offset="55%" stop-color="#0d0a1a"/>
      <stop offset="100%" stop-color="#05060a"/>
    </linearGradient>

    <radialGradient id="spotlight" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#8A2BE2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8A2BE2" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2E9F"/>
      <stop offset="50%" stop-color="#8A2BE2"/>
      <stop offset="100%" stop-color="#00F5FF"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2E9F"/>
      <stop offset="50%" stop-color="#8A2BE2"/>
      <stop offset="100%" stop-color="#00F5FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#spotlight)"/>

  <!-- twinkling stars -->
  <circle cx="90" cy="60" r="1.6" fill="#ffffff">
    <animate attributeName="opacity" values="0.1;1;0.1" dur="3.2s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="140" r="1.2" fill="#ffffff">
    <animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.1s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="70" r="1.4" fill="#00F5FF">
    <animate attributeName="opacity" values="0.1;1;0.1" dur="2.6s" begin="1.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1060" cy="55" r="1.6" fill="#ffffff">
    <animate attributeName="opacity" values="0.1;1;0.1" dur="3.6s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="150" r="1.2" fill="#FF2E9F">
    <animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.9s" begin="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1120" cy="100" r="1.4" fill="#ffffff">
    <animate attributeName="opacity" values="0.1;1;0.1" dur="2.9s" begin="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="40" r="1.2" fill="#ffffff">
    <animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.4s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="230" r="1.3" fill="#8A2BE2">
    <animate attributeName="opacity" values="0.1;1;0.1" dur="3.1s" begin="1.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="240" r="1.3" fill="#ffffff">
    <animate attributeName="opacity" values="0.1;1;0.1" dur="4.4s" begin="0.5s" repeatCount="indefinite"/>
  </circle>

  <!-- title, fades and rises in -->
  <g>
    <text x="600" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
          font-size="70" font-weight="600" letter-spacing="6" fill="url(#titleGrad)" opacity="0">
      ANMOL YADAV
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.15;0.55" dur="2.4s" begin="0s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
                         values="0,26;0,26;0,0" keyTimes="0;0.15;0.55" dur="2.4s" begin="0s" fill="freeze"/>
    </text>
  </g>

  <!-- animated underline -->
  <rect x="600" y="178" width="0" height="3" fill="url(#lineGrad)" rx="1.5">
    <animate attributeName="width" from="0" to="360" dur="1.2s" begin="1.8s" fill="freeze"/>
    <animate attributeName="x" from="600" to="420" dur="1.2s" begin="1.8s" fill="freeze"/>
  </rect>

  <!-- subtitle, fades in last -->
  <text x="600" y="225" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="20" letter-spacing="1" fill="#c9d1d9" opacity="0">
    Full Stack Web &amp; Mobile Engineer  ·  DSA Problem Solver
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6;0.85" dur="3.4s" begin="0s" fill="freeze"/>
  </text>

  <!-- tagline, fades in last -->
  <text x="600" y="260" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="14" letter-spacing="1" fill="#7d8590" opacity="0">
    based in Kanpur, India — this is a true story.
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.75;1" dur="4.4s" begin="0s" fill="freeze"/>
  </text>
</svg>
